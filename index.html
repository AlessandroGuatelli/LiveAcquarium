<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001f2f">
<title>LiveAcquarium — Next Gen Aquarium</title>
<style>
*{box-sizing:border-box}
html,body,#canvas-container{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#000;color:#fff;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
#canvas-container{position:fixed;inset:0;touch-action:none}
#aquarium-canvas{display:block;width:100%;height:100%}
#ui-container{position:fixed;top:18px;left:18px;width:min(310px,calc(100vw - 36px));max-height:calc(100dvh - 36px);overflow:auto;padding:18px;background:rgba(0,15,30,.78);border:1px solid rgba(255,255,255,.15);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 12px 35px rgba(0,0,0,.35);z-index:10}
#ui-container.collapsed .panel-content{display:none}
h2{font-size:18px;margin:0 0 14px}
.control-group{margin:0 0 14px}
.control-group label{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:12px;font-weight:700;color:#bdeaff;text-transform:uppercase;letter-spacing:.7px}
input[type=range]{width:100%;min-height:32px;accent-color:#00b7ff}
input[type=color]{width:100%;height:38px;border:0;border-radius:8px;background:transparent}
.button-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
button{min-height:42px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
#stats{position:fixed;right:18px;top:18px;min-width:180px;padding:12px 14px;background:rgba(0,15,30,.65);border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(10px);z-index:9;font-size:12px}
#stats.hidden{display:none}
.stat-line{display:flex;justify-content:space-between;gap:16px;margin:4px 0}
#modelStatus{margin-top:8px;color:#aee8ff}
#speciesDetail{margin-top:6px;line-height:1.4;color:#c7f3ff}#modelDiagnostics{margin-top:8px;font-size:10px;line-height:1.4;color:#d8f7ff;max-height:120px;overflow:auto}#modelDiagnostics.hidden{display:none}
#pauseBadge{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:20}
#pauseBadge.active{opacity:1}
#mobileHudToggle{display:none;position:fixed;right:12px;top:12px;z-index:30;width:44px;height:44px;border-radius:50%;font-size:22px;background:rgba(0,15,30,.78)}
.mobile-actions{display:none}
@media(max-width:700px),(pointer:coarse){
 #ui-container{top:12px;left:12px;width:min(300px,calc(100vw - 72px));max-height:calc(100dvh - 24px);padding:14px}
 #mobileHudToggle{display:block}
 #stats{left:12px;right:12px;top:auto;bottom:12px;min-width:0;font-size:11px;padding:9px 11px}
 #stats .stat-line{margin:2px 0}
 .mobile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
 button{min-height:46px}
}
@media(max-height:520px) and (orientation:landscape){
 #ui-container{max-height:calc(100dvh - 24px);width:270px}
 #stats{display:none}
}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="canvas-container"></div>
<button id="mobileHudToggle" aria-label="Apri pannello">☰</button>

<section id="ui-container">
  <h2>Pannello Acquario</h2>
  <div class="panel-content">
    <div class="control-group">
      <label><span>Popolazione pesci</span><span id="valFish">1.0x</span></label>
      <input type="range" id="fishScale" min="0" max="200" value="100">
    </div>
    <div class="control-group">
      <label><span>Velocità</span><span id="valSpeed">1.0x</span></label>
      <input type="range" id="swimSpeed" min="0" max="200" value="100">
    </div>
    <div class="control-group">
      <label><span>Luce ambiente</span><span>100%</span></label>
      <input type="range" id="lightIntensity" min="10" max="200" value="100">
    </div>
    <div class="control-group">
      <label><span>Colore acqua</span></label>
      <input type="color" id="waterColor" value="#006994">
    </div>
    <div class="button-row">
      <button id="btnPause" data-pause-label>Ⅱ Pausa</button>
      <button id="btnReset">↺ Reset camera</button>
      <button id="btnFullscreen">⛶ Fullscreen</button>
      <button id="btnStats">☷ HUD</button>
      <button id="btnCenter">◎ Centra creature</button>
      <button id="btnRepopulate">🐟 Ripopola</button>
      <button id="btnDiagnostics">🔎 Diagnostica GLB</button>
    </div>
    <div class="mobile-actions">
      <button id="mobilePause" data-pause-label>Ⅱ Pausa</button>
      <button id="mobileReset">↺ Camera</button>
    </div>
  </div>
</section>

<div id="stats">
  <div class="stat-line"><span>Entità visibili</span><strong id="statTotal">0</strong></div>
  <div class="stat-line"><span>Modelli GLB</span><strong id="statModels">0</strong></div>
  <div class="stat-line"><span>Dispositivo</span><strong id="statMode">—</strong></div>
  <div class="stat-line"><span>FPS</span><strong id="statFps">0</strong></div>
  <div id="statDetail">Pesci: 0 · Granchi: 0 · Coralli: 0</div>
  <div id="speciesDetail">Caricamento specie…</div>
  <div id="modelStatus">Caricamento modelli…</div>
  <div id="modelDiagnostics" class="hidden"></div>
</div>

<div id="pauseBadge">⏸ Acquario in pausa</div>
<script type="module" src="script/app.js"></script>
</body>
</html>
